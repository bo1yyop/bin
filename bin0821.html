<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>하늘이의 사랑받기</title>

<style>

:root {
  --bg: #D1DEF4;
  --frame: #4A5AA8;
  --pink: #FF8FA8;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: var(--bg);

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  overflow: hidden;

  touch-action: none;
  user-select: none;
}

#gameContainer {
  width: 100%;
  height: 100%;

  display: flex;

  justify-content: center;
  align-items: center;
}

#gameBox {
  width: 95%;
  max-width: 700px;

  height: 80vh;
  min-height: 400px;

  border: 5px solid var(--frame);
  border-radius: 18px;

  background: var(--bg);

  position: relative;

  overflow: hidden;

  box-shadow:
    0 10px 30px rgba(0, 0, 0, .12);
}

canvas {
  display: block;

  width: 100%;
  height: 100%;
}


/* =========================
   점수
========================= */

#scoreBox {
  position: absolute;

  top: 12px;
  left: 12px;

  background: white;

  padding: 8px 14px;

  border-radius: 12px;

  font-size: 18px;
  font-weight: bold;

  color: #4A5AA8;

  box-shadow:
    0 5px 15px rgba(0,0,0,.12);

  z-index: 5;
}


/* =========================
   타이머
========================= */

#timerBox {
  position: absolute;

  left: 12px;
  top: 65px;

  width: 42px;
  height: 210px;

  z-index: 5;
}

#timerTrack {
  position: absolute;

  left: 4px;
  top: 24px;

  width: 30px;
  height: 180px;

  background: rgba(255,255,255,.65);

  border: 2px solid white;

  border-radius: 16px;

  box-shadow:
    0 5px 15px rgba(0,0,0,.12);

  overflow: hidden;
}

#timerFill {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 100%;

  background:
    linear-gradient(
      to top,
      #FF6F91,
      #FF9EB5
    );

  border-radius: 14px;
}

#timerText {
  position: absolute;

  left: 50%;

  transform:
    translateX(-50%);

  top: 0;

  white-space: nowrap;

  font-size: 14px;

  font-weight: bold;

  color: #4A5AA8;
}


/* =========================
   시작 / 종료
========================= */

#startUI {
  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  text-align: center;

  z-index: 10;

  width: max-content;
  max-width: 90%;
}

#loveBtn,
#retryBtn {
  background: white;

  border: 1px solid #ddd;

  padding: 16px 28px;

  border-radius: 14px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.15);

  font-size: 24px;

  font-weight: bold;

  color: #4A5AA8;

  cursor: pointer;
}

#loveBtn:active,
#retryBtn:active {
  transform: scale(.95);
}

#gameOverTitle {
  font-size: 30px;

  font-weight: bold;

  margin-bottom: 15px;

  color: #4A5AA8;
}

#gameOverScore {
  font-size: 20px;

  margin-bottom: 18px;

  color: #333;
}


/* =========================
   이미지 오류 표시
========================= */

#imageError {
  display: none;

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 80%;

  padding: 18px;

  background: #fff0f3;

  border: 2px solid #ff6f91;

  border-radius: 14px;

  color: #d6335c;

  font-size: 14px;

  line-height: 1.6;

  text-align: center;

  z-index: 50;
}


/* =========================
   좌우 버튼
========================= */

.ctrl-btn {
  position: fixed;

  bottom: 25px;

  width: 72px;
  height: 72px;

  border-radius: 18px;

  background: white;

  display: none;

  justify-content: center;
  align-items: center;

  box-shadow:
    0 8px 20px rgba(0,0,0,.15);

  font-size: 28px;

  font-weight: bold;

  color: #4A5AA8;

  z-index: 20;

  cursor: pointer;

  touch-action: none;

  -webkit-tap-highlight-color:
    transparent;
}

.ctrl-btn:active {
  background: #f5f5f5;

  transform: scale(.95);
}


@media (min-width: 700px) {

  .ctrl-btn {
    position: absolute;

    bottom: 20px;
  }

  #btnLeft {
    left: 20px;
  }

  #btnRight {
    right: 20px;
  }

}


@media (max-height: 600px) {

  #gameBox {
    height: 90vh;
  }

  .ctrl-btn {
    bottom: 12px;

    width: 62px;
    height: 62px;
  }

}

</style>
</head>


<body>


<div id="gameContainer">

  <div id="gameBox">

    <canvas id="cv"></canvas>


    <div id="scoreBox">
      ❤️ 점수:
      <span id="score">0</span>
    </div>


    <div id="timerBox">

      <div id="timerText">
        20초
      </div>

      <div id="timerTrack">
        <div id="timerFill"></div>
      </div>

    </div>


    <div id="startUI">

      <button id="loveBtn">
        사랑받기!
      </button>

    </div>


    <div id="imageError"></div>

  </div>

</div>


<div id="btnLeft" class="ctrl-btn">
  ◀
</div>

<div id="btnRight" class="ctrl-btn">
  ▶
</div>


<script>


/* ==================================================
   기본 요소
================================================== */

const cv =
  document.getElementById("cv");

const ctx =
  cv.getContext("2d");

const gameBox =
  document.getElementById("gameBox");

const startUI =
  document.getElementById("startUI");

const loveBtn =
  document.getElementById("loveBtn");

const btnLeft =
  document.getElementById("btnLeft");

const btnRight =
  document.getElementById("btnRight");

const scoreEl =
  document.getElementById("score");

const timerFill =
  document.getElementById("timerFill");

const timerText =
  document.getElementById("timerText");

const imageError =
  document.getElementById("imageError");


/* ==================================================
   이미지
================================================== */

const characterImg =
  new Image();

const heartImg =
  new Image();


let characterLoaded = false;
let heartLoaded = false;


/*
 * 이미지 주소
 */

characterImg.src =
  "./images/haneul.png";

heartImg.src =
  "./images/heart.png";


/*
 * 캐릭터 로딩 성공
 */

characterImg.onload =
  function() {

    characterLoaded = true;

    console.log(
      "✅ character.png 로딩 성공",
      characterImg.naturalWidth,
      characterImg.naturalHeight
    );

  };


/*
 * 캐릭터 로딩 실패
 */

characterImg.onerror =
  function() {

    characterLoaded = false;

    console.error(
      "❌ character.png 로딩 실패"
    );

    showImageError();

  };


/*
 * 하트 로딩 성공
 */

heartImg.onload =
  function() {

    heartLoaded = true;

    console.log(
      "✅ heart.png 로딩 성공",
      heartImg.naturalWidth,
      heartImg.naturalHeight
    );

  };


/*
 * 하트 로딩 실패
 */

heartImg.onerror =
  function() {

    heartLoaded = false;

    console.error(
      "❌ heart.png 로딩 실패"
    );

    showImageError();

  };


/*
 * 이미지 오류 화면
 */

function showImageError() {

  imageError.innerHTML = `
    <strong>이미지를 불러오지 못했어요 😭</strong>
    <br><br>
    아래 파일이 있는지 확인해주세요.
    <br><br>
    <code>images/character.png</code>
    <br>
    <code>images/heart.png</code>
    <br><br>
    <small>
      bin0821.html과 images 폴더가
      같은 위치에 있어야 합니다.
    </small>
  `;

  imageError.style.display =
    "block";

}


/* ==================================================
   게임 변수
================================================== */

let W = 0;
let H = 0;

let running = false;

let score = 0;

let gameStartTime = 0;

let animationId = null;

let lastHeartSpawn = 0;


/* ==================================================
   게임 설정
================================================== */

const GAME_TIME = 20;

const heartSpawnInterval = 700;


/* ==================================================
   캐릭터
================================================== */

const character = {

  x: 0,

  y: 0,

  width: 100,

  height: 100,

  speed: 6

};


/* ==================================================
   하트
================================================== */

let hearts = [];


/* ==================================================
   이동 상태
================================================== */

let holdLeft = false;
let holdRight = false;


/* ==================================================
   화면 크기
================================================== */

function resize() {

  W =
    gameBox.clientWidth;

  H =
    gameBox.clientHeight;


  const dpr =
    window.devicePixelRatio || 1;


  cv.width =
    W * dpr;

  cv.height =
    H * dpr;


  cv.style.width =
    W + "px";

  cv.style.height =
    H + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  character.y =
    H -
    character.height -
    30;


  character.x =
    Math.max(
      0,
      Math.min(
        W - character.width,
        character.x
      )
    );

}


resize();


if (window.ResizeObserver) {

  new ResizeObserver(resize)
    .observe(gameBox);

} else {

  window.addEventListener(
    "resize",
    resize
  );

}


/* ==================================================
   게임 시작
================================================== */

function startGame() {

  /*
   * 이미지가 준비되지 않았으면 시작하지 않음
   */

  if (
    !characterLoaded ||
    !heartLoaded
  ) {

    showImageError();

    return;

  }


  if (
    animationId !== null
  ) {

    cancelAnimationFrame(
      animationId
    );

  }


  running = true;

  score = 0;

  hearts = [];


  scoreEl.textContent =
    "0";


  timerFill.style.height =
    "100%";

  timerText.textContent =
    "20초";


  startUI.style.display =
    "none";


  btnLeft.style.display =
    "flex";

  btnRight.style.display =
    "flex";


  character.x =
    W / 2 -
    character.width / 2;


  character.y =
    H -
    character.height -
    30;


  holdLeft = false;
  holdRight = false;


  gameStartTime =
    performance.now();


  lastHeartSpawn =
    performance.now();


  animationId =
    requestAnimationFrame(
      gameLoop
    );

}


/* ==================================================
   하트 생성
================================================== */

function spawnHeart() {

  const size = 42;

  const maxX =
    Math.max(
      0,
      W - size
    );


  hearts.push({

    x:
      Math.random() *
      maxX,

    y:
      -size,

    size:
      size,

    speed:
      2.5 +
      Math.random() * 2

  });

}


/* ==================================================
   충돌
================================================== */

function isColliding(a, b) {

  return !(
    a.x + a.width <
      b.x ||

    a.x >
      b.x + b.size ||

    a.y + a.height <
      b.y ||

    a.y >
      b.y + b.size
  );

}


/* ==================================================
   게임 루프
================================================== */

function gameLoop(time) {

  if (!running) {

    return;

  }


  /* =========================
     타이머
  ========================== */

  const elapsed =
    Math.max(
      0,
      (time - gameStartTime) /
      1000
    );


  const remaining =
    Math.max(
      0,
      GAME_TIME - elapsed
    );


  const percent =
    Math.min(
      1,
      elapsed / GAME_TIME
    );


  timerFill.style.height =
    ((1 - percent) * 100) +
    "%";


  const seconds =
    Math.min(
      GAME_TIME,
      Math.max(
        0,
        Math.ceil(remaining)
      )
    );


  timerText.textContent =
    seconds + "초";


  if (
    remaining <= 0
  ) {

    timerFill.style.height =
      "0%";

    timerText.textContent =
      "0초";

    endGame();

    return;

  }


  /* =========================
     화면 지우기
  ========================== */

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /* =========================
     하트 생성
  ========================== */

  if (
    time -
    lastHeartSpawn >=
    heartSpawnInterval
  ) {

    spawnHeart();

    lastHeartSpawn =
      time;

  }


  /* =========================
     캐릭터 이동
  ========================== */

  if (holdLeft) {

    character.x -=
      character.speed;

  }


  if (holdRight) {

    character.x +=
      character.speed;

  }


  character.x =
    Math.max(
      0,
      Math.min(
        W - character.width,
        character.x
      )
    );


  /* =========================
     하트 이동 + 충돌
  ========================== */

  for (
    let i = hearts.length - 1;
    i >= 0;
    i--
  ) {

    const heart =
      hearts[i];


    heart.y +=
      heart.speed;


    if (
      isColliding(
        character,
        heart
      )
    ) {

      hearts.splice(
        i,
        1
      );


      score++;

      scoreEl.textContent =
        score;


      continue;

    }


    if (
      heart.y >
      H + heart.size
    ) {

      hearts.splice(
        i,
        1
      );

    }

  }


  /* =========================
     하트 그리기
  ========================== */

  for (
    const heart of hearts
  ) {

    ctx.drawImage(

      heartImg,

      heart.x,
      heart.y,

      heart.size,
      heart.size

    );

  }


  /* =========================
     캐릭터 그리기
  ========================== */

  ctx.drawImage(

    characterImg,

    character.x,
    character.y,

    character.width,
    character.height

  );


  /* =========================
     다음 프레임
  ========================== */

  animationId =
    requestAnimationFrame(
      gameLoop
    );

}


/* ==================================================
   게임 종료
================================================== */

function endGame() {

  running = false;


  btnLeft.style.display =
    "none";

  btnRight.style.display =
    "none";


  holdLeft = false;
  holdRight = false;


  startUI.innerHTML = `

    <div id="gameOverTitle">
      사랑받기 완료! 💗
    </div>

    <div id="gameOverScore">
      점수: ${score}점
    </div>

    <button id="retryBtn">
      다시하기
    </button>

  `;


  startUI.style.display =
    "block";


  document
    .getElementById("retryBtn")
    .addEventListener(
      "click",
      startGame
    );

}


/* ==================================================
   좌우 버튼
================================================== */

function setupHoldButton(
  button,
  direction
) {

  button.addEventListener(
    "pointerdown",
    function(e) {

      e.preventDefault();

      if (
        direction === "left"
      ) {

        holdLeft = true;

      } else {

        holdRight = true;

      }

    }
  );


  button.addEventListener(
    "pointerup",
    function(e) {

      e.preventDefault();

      if (
        direction === "left"
      ) {

        holdLeft = false;

      } else {

        holdRight = false;

      }

    }
  );


  button.addEventListener(
    "pointercancel",
    function() {

      if (
        direction === "left"
      ) {

        holdLeft = false;

      } else {

        holdRight = false;

      }

    }
  );


  button.addEventListener(
    "pointerleave",
    function() {

      if (
        direction === "left"
      ) {

        holdLeft = false;

      } else {

        holdRight = false;

      }

    }
  );

}


setupHoldButton(
  btnLeft,
  "left"
);

setupHoldButton(
  btnRight,
  "right"
);


/* ==================================================
   키보드
================================================== */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "ArrowLeft"
    ) {

      e.preventDefault();

      holdLeft = true;

    }


    if (
      e.key === "ArrowRight"
    ) {

      e.preventDefault();

      holdRight = true;

    }

  }
);


document.addEventListener(
  "keyup",
  function(e) {

    if (
      e.key === "ArrowLeft"
    ) {

      holdLeft = false;

    }


    if (
      e.key === "ArrowRight"
    ) {

      holdRight = false;

    }

  }
);


window.addEventListener(
  "blur",
  function() {

    holdLeft = false;
    holdRight = false;

  }
);


/* ==================================================
   시작 버튼
================================================== */

loveBtn.addEventListener(
  "click",
  startGame
);

</script>

</body>
</html>
