<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>하늘이의 사랑받기</title>

<style>

:root {
  --bg: #D1DEF4;
  --frame: #4A5AA8;
  --pink: #FF8FA8;
  --pink-dark: #FF6F91;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: var(--bg);

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  overflow: hidden;

  touch-action: none;
  user-select: none;
}

#gameContainer {
  width: 100%;
  height: 100%;

  display: flex;

  justify-content: center;
  align-items: center;
}

#gameBox {
  width: 95%;
  max-width: 700px;

  height: 80vh;
  min-height: 400px;

  border: 5px solid var(--frame);
  border-radius: 18px;

  background: var(--bg);

  position: relative;

  overflow: hidden;

  box-shadow:
    0 10px 30px rgba(0, 0, 0, .12);
}

canvas {
  display: block;

  width: 100%;
  height: 100%;
}


/* ==================================================
   점수
================================================== */

#scoreBox {
  position: absolute;

  top: 12px;
  left: 12px;

  background: white;

  padding: 8px 14px;

  border-radius: 12px;

  font-size: 18px;
  font-weight: bold;

  color: #4A5AA8;

  box-shadow:
    0 5px 15px rgba(0,0,0,.12);

  z-index: 5;
}


/* ==================================================
   타이머
================================================== */

#timerBox {
  position: absolute;

  left: 12px;
  top: 65px;

  width: 42px;
  height: 210px;

  z-index: 5;
}


/* 타이머 바깥 */

#timerTrack {
  position: absolute;

  left: 4px;
  top: 24px;

  width: 30px;
  height: 180px;

  background: rgba(255,255,255,.65);

  border: 2px solid white;

  border-radius: 16px;

  box-shadow:
    0 5px 15px rgba(0,0,0,.12);

  overflow: hidden;
}


/* 실제로 줄어드는 게이지 */

#timerFill {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 100%;

  background:
    linear-gradient(
      to top,
      #FF6F91,
      #FF9EB5
    );

  border-radius: 14px;

  transition:
    height .08s linear;
}


/* 타이머 숫자 */

#timerText {
  position: absolute;

  left: 50%;

  transform:
    translateX(-50%);

  top: 0;

  white-space: nowrap;

  font-size: 14px;

  font-weight: bold;

  color: #4A5AA8;
}


/* ==================================================
   시작 / 종료 화면
================================================== */

#startUI {
  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  text-align: center;

  z-index: 10;

  width: max-content;
  max-width: 90%;
}


/* 시작 버튼 */

#loveBtn,
#retryBtn {
  background: white;

  border: 1px solid #ddd;

  padding: 16px 28px;

  border-radius: 14px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.15);

  font-size: 24px;

  font-weight: bold;

  color: #4A5AA8;

  cursor: pointer;

  transition:
    transform .1s ease,
    box-shadow .1s ease;
}

#loveBtn:active,
#retryBtn:active {
  transform: scale(.95);

  box-shadow:
    0 4px 10px rgba(0,0,0,.12);
}


/* 종료 화면 */

#gameOverTitle {
  font-size: 30px;

  font-weight: bold;

  margin-bottom: 15px;

  color: #4A5AA8;
}

#gameOverScore {
  font-size: 20px;

  margin-bottom: 18px;

  color: #333;
}


/* ==================================================
   좌우 버튼
================================================== */

.ctrl-btn {
  position: fixed;

  bottom: 25px;

  width: 72px;
  height: 72px;

  border-radius: 18px;

  background: white;

  display: none;

  justify-content: center;
  align-items: center;

  box-shadow:
    0 8px 20px rgba(0,0,0,.15);

  font-size: 28px;

  font-weight: bold;

  color: #4A5AA8;

  z-index: 20;

  cursor: pointer;

  touch-action: none;

  -webkit-tap-highlight-color:
    transparent;
}

.ctrl-btn:active {
  background: #f5f5f5;

  transform: scale(.95);
}


/* PC */

@media (min-width: 700px) {

  .ctrl-btn {
    position: absolute;

    bottom: 20px;
  }

  #btnLeft {
    left: 20px;
  }

  #btnRight {
    right: 20px;
  }
}


/* 작은 모바일 화면 */

@media (max-height: 600px) {

  #gameBox {
    height: 90vh;
  }

  .ctrl-btn {
    bottom: 12px;

    width: 62px;
    height: 62px;
  }

}

</style>
</head>


<body>


<div id="gameContainer">

  <div id="gameBox">

    <canvas id="cv"></canvas>


    <!-- =========================
         점수
    ========================== -->

    <div id="scoreBox">
      ❤️ 점수:
      <span id="score">0</span>
    </div>


    <!-- =========================
         타이머
    ========================== -->

    <div id="timerBox">

      <div id="timerText">
        20초
      </div>

      <div id="timerTrack">

        <div id="timerFill"></div>

      </div>

    </div>


    <!-- =========================
         시작 / 종료 UI
    ========================== -->

    <div id="startUI">

      <button id="loveBtn">
        사랑받기!
      </button>

    </div>

  </div>

</div>


<!-- =========================
     좌우 버튼
========================== -->

<div id="btnLeft" class="ctrl-btn">
  ◀
</div>

<div id="btnRight" class="ctrl-btn">
  ▶
</div>


<script>


/* ==================================================
   기본 요소
================================================== */

const cv =
  document.getElementById("cv");

const ctx =
  cv.getContext("2d");


const gameBox =
  document.getElementById("gameBox");


const startUI =
  document.getElementById("startUI");


const loveBtn =
  document.getElementById("loveBtn");


const btnLeft =
  document.getElementById("btnLeft");


const btnRight =
  document.getElementById("btnRight");


const scoreEl =
  document.getElementById("score");


const timerFill =
  document.getElementById("timerFill");


const timerText =
  document.getElementById("timerText");



/* ==================================================
   이미지
================================================== */

const characterImg =
  new Image();

const heartImg =
  new Image();


characterImg.src = "./images/character.png";

heartImg.src = "./images/heart.png";



/* 이미지 로딩 오류 확인 */

characterImg.onerror = function () {

  console.error(
    "❌ 캐릭터 이미지 로딩 실패:",
    characterImg.src
  );

};


heartImg.onerror = function () {

  console.error(
    "❌ 하트 이미지 로딩 실패:",
    heartImg.src
  );

};



/* 이미지가 실제로 로딩됐는지 확인 */

function imageReady(img) {

  return (
    img.complete &&
    img.naturalWidth > 0
  );

}



/* ==================================================
   게임 변수
================================================== */

let W = 0;
let H = 0;

let running = false;

let score = 0;

let gameStartTime = 0;

let animationId = null;


/* ==================================================
   게임 설정
================================================== */

const GAME_TIME = 20;


/* 하트 생성 간격 */

const heartSpawnInterval = 700;


/* ==================================================
   캐릭터
================================================== */

const character = {

  x: 0,

  y: 0,

  size: 100,

  speed: 6

};



/* ==================================================
   하트
================================================== */

let hearts = [];



/* ==================================================
   키 상태
================================================== */

let holdLeft = false;

let holdRight = false;



/* ==================================================
   화면 크기
================================================== */

function resize() {

  W =
    gameBox.clientWidth;

  H =
    gameBox.clientHeight;


  const dpr =
    window.devicePixelRatio || 1;


  cv.width =
    W * dpr;

  cv.height =
    H * dpr;


  cv.style.width =
    W + "px";

  cv.style.height =
    H + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  /*
   * 캐릭터를 바닥 쪽에 배치
   */

  character.y =
    H -
    character.size -
    30;


  /*
   * 화면 밖으로 나가지 않게
   */

  character.x =
    Math.max(
      0,
      Math.min(
        W - character.size,
        character.x
      )
    );

}


/* 최초 실행 */

resize();


/* 화면 크기 변경 */

if (window.ResizeObserver) {

  new ResizeObserver(resize)
    .observe(gameBox);

} else {

  window.addEventListener(
    "resize",
    resize
  );

}



/* ==================================================
   게임 시작
================================================== */

function startGame() {

  /*
   * 이전 게임의 animationFrame이
   * 혹시 남아있다면 취소
   */

  if (animationId !== null) {

    cancelAnimationFrame(
      animationId
    );

  }


  running = true;

  score = 0;

  hearts = [];


  scoreEl.textContent =
    "0";


  /*
   * 타이머 초기화
   */

  timerFill.style.height =
    "100%";

  timerText.textContent =
    "20초";


  /*
   * 시작 UI 숨기기
   */

  startUI.style.display =
    "none";


  /*
   * 좌우 버튼 표시
   */

  btnLeft.style.display =
    "flex";

  btnRight.style.display =
    "flex";


  /*
   * 캐릭터 중앙 배치
   */

  character.x =
    W / 2 -
    character.size / 2;


  character.y =
    H -
    character.size -
    30;


  /*
   * 버튼 상태 초기화
   */

  holdLeft = false;
  holdRight = false;


  /*
   * 시작 시간
   */

  gameStartTime =
    performance.now();


  /*
   * 첫 하트가 너무 늦게 나오지 않게
   */

  lastHeartSpawn =
    performance.now();


  /*
   * 게임 시작
   */

  animationId =
    requestAnimationFrame(
      gameLoop
    );

}



/* ==================================================
   하트 생성
================================================== */

function spawnHeart() {

  const size = 42;


  /*
   * 화면 폭보다 하트가 커지는 경우 방지
   */

  const maxX =
    Math.max(
      0,
      W - size
    );


  hearts.push({

    x:
      Math.random() *
      maxX,

    y:
      -size,

    size:
      size,

    speed:
      2.5 +
      Math.random() * 2

  });

}



/* ==================================================
   충돌 검사
================================================== */

function isColliding(a, b) {

  return !(
    a.x + a.size < b.x ||

    a.x >
      b.x + b.size ||

    a.y + a.size <
      b.y ||

    a.y >
      b.y + b.size
  );

}



/* ==================================================
   게임 루프
================================================== */

let lastHeartSpawn = 0;


function gameLoop(time) {

  /*
   * 게임이 끝났다면 종료
   */

  if (!running) {

    return;

  }


  /* ==================================================
     타이머
  ================================================== */

  const elapsed =
    (time - gameStartTime) /
    1000;


  const remaining =
    Math.max(
      0,
      GAME_TIME - elapsed
    );


  /*
   * 0 ~ 1
   *
   * 0 = 시작
   * 1 = 20초 종료
   */

  const percent =
    Math.min(
      1,
      elapsed / GAME_TIME
    );


  /*
   * 타이머 게이지 감소
   *
   * 시작: 100%
   * 종료: 0%
   */

  timerFill.style.height =
    (
      (1 - percent) * 100
    ) + "%";


  /*
   * 숫자는 자연스럽게
   *
   * 20
   * 19
   * 18
   * ...
   * 1
   * 0
   */

  timerText.textContent =
    Math.ceil(remaining) +
    "초";


  /*
   * 20초 종료
   */

  if (remaining <= 0) {

    timerFill.style.height =
      "0%";

    timerText.textContent =
      "0초";

    endGame();

    return;

  }



  /* ==================================================
     캔버스 지우기
  ================================================== */

  ctx.clearRect(
    0,
    0,
    W,
    H
  );



  /* ==================================================
     하트 생성
  ================================================== */

  if (
    time -
    lastHeartSpawn >=
    heartSpawnInterval
  ) {

    spawnHeart();

    lastHeartSpawn =
      time;

  }



  /* ==================================================
     캐릭터 이동
  ================================================== */

  if (holdLeft) {

    character.x -=
      character.speed;

  }


  if (holdRight) {

    character.x +=
      character.speed;

  }


  /*
   * 화면 밖으로 못 나가게
   */

  character.x =
    Math.max(
      0,
      Math.min(
        W - character.size,
        character.x
      )
    );



  /* ==================================================
     하트 이동 + 충돌
  ================================================== */

  for (
    let i = hearts.length - 1;
    i >= 0;
    i--
  ) {

    const heart =
      hearts[i];


    /*
     * 하트를 아래로 이동
     */

    heart.y +=
      heart.speed;



    /*
     * 캐릭터와 충돌
     */

    if (
      isColliding(
        character,
        heart
      )
    ) {

      /*
       * 하트 삭제
       */

      hearts.splice(
        i,
        1
      );


      /*
       * 점수 +1
       */

      score++;

      scoreEl.textContent =
        score;


      continue;

    }



    /*
     * 화면 아래로 나간 하트 삭제
     */

    if (
      heart.y >
      H + heart.size
    ) {

      hearts.splice(
        i,
        1
      );

    }

  }



  /* ==================================================
     하트 그리기
  ================================================== */

  if (
    imageReady(heartImg)
  ) {

    for (
      const heart of hearts
    ) {

      const character = {
      x: 0,
      y: 0,

      width: 100,
      height: 100,

      speed: 6
      };

    }

  }



  /* ==================================================
     캐릭터 그리기
  ================================================== */

  if (
    imageReady(characterImg)
  ) {

    ctx.drawImage(

      characterImg,

      character.x,
      character.y,

      character.size,
      character.size

    );

  }



  /* ==================================================
     다음 프레임
  ================================================== */

  animationId =
    requestAnimationFrame(
      gameLoop
    );

}



/* ==================================================
   게임 종료
================================================== */

function endGame() {

  running = false;


  /*
   * 좌우 버튼 숨기기
   */

  btnLeft.style.display =
    "none";

  btnRight.style.display =
    "none";


  /*
   * 키 상태 초기화
   */

  holdLeft = false;
  holdRight = false;


  /*
   * 종료 화면
   */

  startUI.innerHTML = `

    <div id="gameOverTitle">
      사랑받기 완료! 💗
    </div>

    <div id="gameOverScore">
      점수: ${score}점
    </div>

    <button id="retryBtn">
      다시하기
    </button>

  `;


  startUI.style.display =
    "block";


  /*
   * 다시하기 버튼
   */

  const retryBtn =
    document.getElementById(
      "retryBtn"
    );


  retryBtn.addEventListener(
    "click",
    startGame
  );

}



/* ==================================================
   좌우 버튼 공통 처리
================================================== */

function setupHoldButton(
  button,
  direction
) {

  /*
   * 버튼 누르기
   */

  button.addEventListener(
    "pointerdown",
    function(e) {

      e.preventDefault();

      if (direction === "left") {

        holdLeft = true;

      } else {

        holdRight = true;

      }

    }
  );


  /*
   * 손가락 떼기
   */

  button.addEventListener(
    "pointerup",
    function(e) {

      e.preventDefault();

      if (direction === "left") {

        holdLeft = false;

      } else {

        holdRight = false;

      }

    }
  );


  /*
   * 터치 취소
   */

  button.addEventListener(
    "pointercancel",
    function() {

      if (direction === "left") {

        holdLeft = false;

      } else {

        holdRight = false;

      }

    }
  );


  /*
   * 화면 밖으로 손가락이 나간 경우
   */

  button.addEventListener(
    "pointerleave",
    function() {

      if (direction === "left") {

        holdLeft = false;

      } else {

        holdRight = false;

      }

    }
  );

}


/*
 * 좌우 버튼 연결
 */

setupHoldButton(
  btnLeft,
  "left"
);

setupHoldButton(
  btnRight,
  "right"
);



/* ==================================================
   PC 키보드
================================================== */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "ArrowLeft"
    ) {

      e.preventDefault();

      holdLeft = true;

    }


    if (
      e.key === "ArrowRight"
    ) {

      e.preventDefault();

      holdRight = true;

    }

  }
);


document.addEventListener(
  "keyup",
  function(e) {

    if (
      e.key === "ArrowLeft"
    ) {

      holdLeft = false;

    }


    if (
      e.key === "ArrowRight"
    ) {

      holdRight = false;

    }

  }
);


/*
 * 창에서 포커스를 잃었을 때
 * 키가 계속 눌린 것으로 남는 것 방지
 */

window.addEventListener(
  "blur",
  function() {

    holdLeft = false;
    holdRight = false;

  }
);



/* ==================================================
   사랑받기 버튼
================================================== */

loveBtn.addEventListener(
  "click",
  startGame
);


</script>

</body>
</html>
