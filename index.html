<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>하늘이의 웹코딩</title>

<style>

@font-face {
font-family: 'MissedGyuwon';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2510-1@1.0/Griun_Gyuwon-Rg.woff2') format('woff2');
font-weight: normal;
font-display: swap;
}

body {
  margin: 0;
  height: 100vh;
  background: #b8f5a6; /* 연두색 */
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
}

/* 네모 테두리 박스 */
.box {
  width: 800px;
  height: 800px;
  top: -100px;
  border: 7px solid #2e7d32;
  border-radius: 20px;
  background: #d9ffcc;
  position: relative;
  overflow: visible;
  text-align: center;
  padding-top: 30px;
}

/* 개구리 */
.frog {
  font-size: 100px;
  position: absolute;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  animation: jump 1.0s infinite;
}

@keyframes jump {
  0%   { transform: translate(-50%, 0); }
  30%  { transform: translate(-50%, -40px); }
  60%  { transform: translate(-50%, 0); }
  100% { transform: translate(-50%, 0); }
}

/* 버튼 */
button {
  margin: 15px auto;
  padding: 12px 30px;
  border: none;
  border-radius: 15px;
  background: #66bb6a;
  color: white;
  font-size: 32px;
  cursor: pointer;
  display: block;
}


button:hover {
  background: #43a047;
}

h1 {
  font-family: 'MissedGyuwon';
  font-size: 70px;
  color: #018b08;
}

</style>
</head>

<body>

<div class="box">

  <h1>하늘이의 웹코딩</h1>

  <div class="frog">🐸</div>

  <button onclick="location.href='https://bo1yyop.github.io/bin/bin0411.html'">
    하늘이 편지 받기
  </button>

  <button onclick="location.href='#'">
    하늘이의 사랑받기
  </button>

  <button onclick="location.href='#'">
    하늘이에게 마라탕 사주기
  </button>

</div>

</body>
</html>
