<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>하늘이의 웹코딩</title>

<style>

@font-face {
font-family: 'MissedGyuwon';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2510-1@1.0/Griun_Gyuwon-Rg.woff2') format('woff2');
font-weight: normal;
font-display: swap;
}

body {
  margin: 0;
  height: 100vh;
  background: #b8f5a6; /* 연두색 */
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
}

/* 네모 테두리 박스 */
.box {
  width: 450px;
  height: 520px;
  border: 5px solid #2e7d32;
  border-radius: 20px;
  background: #d9ffcc;
  position: relative;
  overflow: hidden;
  text-align: center;
  padding-top: 20px;
}

/* 개구리 */
.frog {
  font-size: 70px;
  position: absolute;
  bottom: 170px;
  left: 50%;
  transform: translateX(-50%);
  animation: jump 1.2s infinite;
}

@keyframes jump {
  0%   { transform: translate(-50%, 0); }
  30%  { transform: translate(-50%, -40px); }
  60%  { transform: translate(-50%, 0); }
  100% { transform: translate(-50%, 0); }
}

/* 버튼 */
button {
  margin-top: 280px;
  padding: 12px 20px;
  border: none;
  border-radius: 12px;
  background: #66bb6a;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #43a047;
}

h1 {
  font-family: 'MissedGyuwon';
}

</style>
</head>

<body>

<div class="box">

  <h2>하늘이의 웹코딩</h2>

  <div class="frog">🐸</div>

  <button onclick="location.href='https://bo1yyop.github.io/bin/bin0411.html'">
  하늘이 편지 받기
  </button>

</div>

</body>
</html>
